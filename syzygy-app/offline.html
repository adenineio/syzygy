<!doctype html>
<meta charset="utf-8">
<title>Syzygy</title>
<style>
  :root { color-scheme: dark }
  /* The window has no title bar, so the whole page is where it is dragged from. */
  body { -webkit-app-region: drag;
         margin: 0; display: grid; place-items: center; min-height: 100vh;
         background: #0b0f12; color: #cfe6ef;
         font: 14px/1.6 -apple-system, system-ui, sans-serif }
  main { max-width: 34rem; padding: 2rem }
  h1 { font-size: 1rem; font-weight: 600; letter-spacing: .04em; margin: 0 0 1rem }
  code { color: #70bfdb }
  p { margin: 0 0 .8rem }
  .dim { color: #6d838c }
</style>
<main>
  <h1>SYZYGY</h1>
  <p>Looking for the relay on <code>127.0.0.1:__SZG_PORT__</code>.</p>
  <p class="dim">__SZG_REASON__</p>
  <p>If this page stays: start a Claude Code session, which starts the relay
     itself, or run the relay by hand from the checkout.</p>
  <p class="dim">Press ⌘R to try again.</p>
</main>
